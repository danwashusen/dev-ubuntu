---
workstation_user: YOUR_USER

# Ubuntu 26.04 defaults to sudo-rs. Ansible 2.13 cannot recognize its password
# prompt, so use Ubuntu's supported sudo.ws compatibility executable for become.
ansible_become_exe: /usr/bin/sudo.ws

workstation_timezone: Australia/Melbourne
keyboard_layout: us

# Correct VM clock drift from the Ansible controller before apt validates
# repository timestamps. This commonly matters after a VM has been suspended.
maximum_clock_skew_seconds: 60

# A full upgrade is appropriate for a newly installed VM. Disable it when a
# maintenance window must not include a distribution package upgrade.
perform_full_upgrade: true

install_firefox: true
install_chrome: true
install_vscode: true
install_1password: true
install_mise: true
install_github_cli: true
install_claude_desktop: true
install_claude_code: true
install_docker: true
install_oh_my_zsh: true
install_powerlevel10k: true

# When Parallels Tools is absent in the guest, attach the host-bundled ARM ISO
# and mount it in Ubuntu. Keep unattended installation opt-in for standalone
# playbook runs; the end-to-end bootstrap overrides it to true.
prepare_parallels_tools_media: true
install_parallels_tools_automatically: false
parallels_vm_name: YOUR_VM_NAME
parallels_prlctl_path: /usr/local/bin/prlctl
parallels_tools_iso_path: "/Applications/Parallels Desktop.app/Contents/Resources/Tools/prl-tools-lin-arm.iso"
parallels_tools_mount_path: /media/cdrom0

# Autoinstall creates this temporary NOPASSWD rule so the initial playbook can
# run unattended. site.yml removes it as its final privileged action.
bootstrap_passwordless_sudo_path: /etc/sudoers.d/99-dev-ubuntu-bootstrap

# Keep .zshrc Linux-specific, but reuse the portable prompt configuration and
# recommended fonts from the controller when they are available.
sync_controller_powerlevel10k_config: true
sync_controller_powerlevel10k_fonts: true
sync_controller_git_config: true
sync_controller_ssh_key: true
controller_powerlevel10k_config_path: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.p10k.zsh
controller_powerlevel10k_font_dir: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/Library/Fonts
controller_git_config_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}"
controller_git_config_files:
  - .gitconfig
  - .gitconfig-higeia
controller_ssh_key_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
controller_ssh_key_files:
  - path: id_rsa
    mode: "0600"
  - path: id_rsa.pub
    mode: "0644"

oh_my_zsh_version: master
powerlevel10k_version: master
oh_my_zsh_plugins:
  - git
  - aws
  - ansible
  - docker
  - gradle
  - npm
  - terraform
  - zoxide
  - fzf

# GitHub's repository tracks current gh releases more closely than Ubuntu's
# community package. Pin the exact vendor-published keyring contents.
github_cli_signing_key_url: >-
  https://cli.github.com/packages/githubcli-archive-keyring.gpg
github_cli_signing_key_sha256: >-
  6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b
github_cli_repository_url: https://cli.github.com/packages

# The native Claude Code installer accepts "stable", "latest", or a version.
claude_code_channel: stable

# Claude Desktop's Linux beta is available for Ubuntu on ARM64 from Anthropic's
# signed apt repository.
claude_desktop_signing_key_url: >-
  https://downloads.claude.ai/claude-desktop/key.asc
claude_desktop_signing_key_fingerprint: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
claude_desktop_repository_url: >-
  https://downloads.claude.ai/claude-desktop/apt/stable

# 1Password's desktop Debian package is amd64-only, so use its signed ARM64
# archive for the app. The CLI is available from the vendor's ARM64 apt repo.
onepassword_archive_url: >-
  https://downloads.1password.com/linux/tar/stable/aarch64/1password-latest.tar.gz
onepassword_signature_url: "{{ onepassword_archive_url }}.sig"
onepassword_signing_key_url: >-
  https://downloads.1password.com/linux/keys/1password.asc
onepassword_signing_key_fingerprint: 3FEF9748469ADBE15DA7CA80AC2D62742012EA22
onepassword_cli_repository_url: >-
  https://downloads.1password.com/linux/debian/arm64
onepassword_debsig_policy_url: >-
  https://downloads.1password.com/linux/debian/debsig/1password.pol

# Copy only the selected Claude Code configuration below from the Ansible
# controller when it exists. Personal files remain outside this repository.
sync_controller_claude_config: true
controller_user_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
controller_claude_config_dir: "{{ controller_user_home }}/.claude"
controller_claude_config_files:
  - path: hooks/block-commands.sh
    mode: "0755"
  - path: statusline-command.sh
    mode: "0755"
  - path: settings.json
    mode: "0600"
controller_claude_config_directories:
  - output-styles

# Rewrite the controller's absolute home path in the few copied files known to
# contain machine-specific paths. Missing files are ignored.
controller_claude_path_rewrite_files:
  - hooks/block-commands.sh
  - settings.json

# This workstation uses native DEB packages for its browsers. A fresh Server
# install therefore has no Snap requirement. Set false if you use other snaps.
remove_snapd: true

# Start at 1. Retina/Parallels displays may be more comfortable at 1.5 or 2.
hyprland_scale: 1
# Require Option+Command together for Hyprland shortcuts in Parallels.
hyprland_main_modifier: ALT SUPER

# Parallels publishes resized virtio modes, but its Linux Wayland client only
# knows how to configure GNOME/Mutter. Bridge those modes into Hyprland.
enable_parallels_hyprland_integration: true
parallels_hyprland_output: Virtual-1
# Parallels v27 publishes live sizes, but its virtio GPU rejects Hyprland's
# runtime modesets. Use a practical fixed startup size instead.
parallels_dynamic_resolution_enabled: false
parallels_hyprland_fixed_mode: 1920x1200@59.88
parallels_dynamic_resolution_poll_interval: 0.25
# The legacy DRM path currently makes Hyprland 0.53 exit on Parallels v27.
# Keep atomic modesetting enabled so a failed resize cannot break login.
hyprland_use_legacy_drm: false

# Use Ubuntu's packaged JetBrains Mono throughout the desktop UI.
ui_font_family: JetBrains Mono
ui_font_size: 11

ghostty_font_size: 13
ghostty_font_family: "{{ ui_font_family }}"
# Retain Powerlevel10k and Nerd Font glyphs without changing the primary face.
ghostty_fallback_font_family: MesloLGS NF
# Parallels virgl exposes less than the OpenGL 4.3 required by Ghostty.
ghostty_force_software_rendering: true

# Reboot remains an explicit choice by default.
reboot_after_provision: false

# Add machine-specific apt packages without changing a role.
developer_extra_packages: []
