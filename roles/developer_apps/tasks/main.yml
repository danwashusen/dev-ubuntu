---
- name: Install Google Chrome ARM64
  when: install_chrome | bool
  block:
    - name: Download Google Chrome ARM64 package
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
        dest: /var/tmp/google-chrome-stable_current_arm64.deb
        mode: "0644"

    - name: Inspect Google Chrome package architecture
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - --field
          - /var/tmp/google-chrome-stable_current_arm64.deb
          - Architecture
      register: chrome_package_architecture
      changed_when: false

    - name: Verify Google Chrome package architecture
      ansible.builtin.assert:
        that:
          - chrome_package_architecture.stdout == "arm64"
        fail_msg: Downloaded Google Chrome package is not ARM64.

    - name: Install Google Chrome package
      ansible.builtin.apt:
        deb: /var/tmp/google-chrome-stable_current_arm64.deb
        state: present

- name: Install Visual Studio Code ARM64
  when: install_vscode | bool
  block:
    - name: Download Microsoft repository signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /var/tmp/microsoft.asc
        mode: "0644"
      register: microsoft_signing_key

    - name: Convert Microsoft signing key to a keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - --output
          - /usr/share/keyrings/microsoft.gpg
          - /var/tmp/microsoft.asc
      when: microsoft_signing_key.changed
      changed_when: true

    - name: Configure Visual Studio Code apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/vscode.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://packages.microsoft.com/repos/code
          Suites: stable
          Components: main
          Architectures: arm64
          Signed-By: /usr/share/keyrings/microsoft.gpg

    - name: Install Visual Studio Code
      ansible.builtin.apt:
        name: code
        state: present
        update_cache: true

- name: Install 1Password for ARM64
  tags: [onepassword]
  when: install_1password | bool
  block:
    - name: Create 1Password download cache
      ansible.builtin.file:
        path: /var/cache/dev-ubuntu/1password
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download 1Password signing key
      ansible.builtin.get_url:
        url: "{{ onepassword_signing_key_url }}"
        dest: /var/cache/dev-ubuntu/1password/1password.asc
        owner: root
        group: root
        mode: "0644"
      register: onepassword_signing_key

    - name: Inspect 1Password signing key
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - /var/cache/dev-ubuntu/1password/1password.asc
      register: onepassword_signing_key_details
      changed_when: false

    - name: Verify 1Password signing key fingerprint
      ansible.builtin.assert:
        that:
          - >-
            ('fpr:::::::::' ~ onepassword_signing_key_fingerprint ~ ':')
            in onepassword_signing_key_details.stdout
        fail_msg: The downloaded 1Password signing key has an unexpected fingerprint.

    - name: Inspect installed 1Password verification keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/1password-archive-keyring.gpg
      register: onepassword_keyring

    - name: Create 1Password verification keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - --output
          - /usr/share/keyrings/1password-archive-keyring.gpg
          - /var/cache/dev-ubuntu/1password/1password.asc
      when:
        - onepassword_signing_key.changed or not onepassword_keyring.stat.exists
      changed_when: true

    - name: Create 1Password package-signature policy directory
      ansible.builtin.file:
        path: /etc/debsig/policies/AC2D62742012EA22
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install 1Password package-signature policy
      ansible.builtin.get_url:
        url: "{{ onepassword_debsig_policy_url }}"
        dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
        owner: root
        group: root
        mode: "0644"

    - name: Create 1Password package-signature keyring directory
      ansible.builtin.file:
        path: /usr/share/debsig/keyrings/AC2D62742012EA22
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install 1Password package-signature keyring
      ansible.builtin.copy:
        src: /usr/share/keyrings/1password-archive-keyring.gpg
        dest: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Configure 1Password CLI ARM64 apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/1password-cli.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ onepassword_cli_repository_url }}
          Suites: stable
          Components: main
          Architectures: arm64
          Signed-By: /usr/share/keyrings/1password-archive-keyring.gpg

    - name: Install 1Password CLI
      ansible.builtin.apt:
        name:
          - debsig-verify
          - 1password-cli
        state: present
        update_cache: true

    - name: Verify 1Password CLI installation
      ansible.builtin.command:
        argv:
          - /usr/bin/op
          - --version
      changed_when: false

    - name: Download 1Password ARM64 archive
      ansible.builtin.get_url:
        url: "{{ onepassword_archive_url }}"
        dest: /var/cache/dev-ubuntu/1password/1password-latest.tar.gz
        owner: root
        group: root
        mode: "0644"
      register: onepassword_archive

    - name: Download 1Password archive signature
      ansible.builtin.get_url:
        url: "{{ onepassword_signature_url }}"
        dest: /var/cache/dev-ubuntu/1password/1password-latest.tar.gz.sig
        owner: root
        group: root
        mode: "0644"

    - name: Verify 1Password archive signature
      ansible.builtin.command:
        argv:
          - gpgv
          - --keyring
          - /usr/share/keyrings/1password-archive-keyring.gpg
          - /var/cache/dev-ubuntu/1password/1password-latest.tar.gz.sig
          - /var/cache/dev-ubuntu/1password/1password-latest.tar.gz
      changed_when: false

    - name: Inspect installed 1Password application
      ansible.builtin.stat:
        path: /opt/1Password/1password
      register: onepassword_application

    - name: Create 1Password installation directory
      ansible.builtin.file:
        path: /opt/1Password
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract 1Password ARM64 application
      ansible.builtin.unarchive:
        src: /var/cache/dev-ubuntu/1password/1password-latest.tar.gz
        dest: /opt/1Password
        remote_src: true
        extra_opts:
          - --strip-components=1
      when:
        - onepassword_archive.changed or not onepassword_application.stat.exists
      register: onepassword_extracted

    - name: Inspect 1Password command integration
      ansible.builtin.stat:
        path: /usr/bin/1password
      register: onepassword_command

    - name: Inspect 1Password desktop integration
      ansible.builtin.stat:
        path: /usr/share/applications/1password.desktop
      register: onepassword_desktop_entry

    - name: Install 1Password desktop-menu compatibility helper
      ansible.builtin.copy:
        dest: /var/cache/dev-ubuntu/1password/xdg-desktop-menu
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu

          desktop_file=""
          for argument do
            case "${argument}" in
              *.desktop) desktop_file="${argument}" ;;
            esac
          done

          if [ -z "${desktop_file}" ]; then
            echo "No desktop file was provided." >&2
            exit 2
          fi

          /usr/bin/install -Dm0644 \
            "${desktop_file}" \
            "/usr/share/applications/$(/usr/bin/basename "${desktop_file}")"

    - name: Run 1Password post-install integration
      ansible.builtin.command:
        argv:
          - /opt/1Password/after-install.sh
      environment:
        PATH: /var/cache/dev-ubuntu/1password:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        XDG_CONFIG_DIRS: /etc/xdg
        XDG_DATA_DIRS: /usr/local/share:/usr/share
      when:
        - >-
          onepassword_extracted.changed or
          not onepassword_command.stat.exists or
          not onepassword_desktop_entry.stat.exists
      changed_when: true

- name: Install mise from its official apt repository
  when: install_mise | bool
  block:
    - name: Create apt keyring directory for mise
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download mise repository signing key
      ansible.builtin.get_url:
        url: https://mise.jdx.dev/gpg-key.pub
        dest: /etc/apt/keyrings/mise-archive-keyring.asc
        mode: "0644"

    - name: Configure mise apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/mise.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://mise.jdx.dev/deb
          Suites: stable
          Components: main
          Architectures: arm64
          Signed-By: /etc/apt/keyrings/mise-archive-keyring.asc

    - name: Install mise
      ansible.builtin.apt:
        name: mise
        state: present
        update_cache: true

- name: Install Claude Desktop for ARM64
  tags: [claude_desktop]
  when: install_claude_desktop | bool
  block:
    - name: Download Claude Desktop repository signing key
      ansible.builtin.get_url:
        url: "{{ claude_desktop_signing_key_url }}"
        dest: /usr/share/keyrings/claude-desktop-archive-keyring.asc
        owner: root
        group: root
        mode: "0644"

    - name: Inspect Claude Desktop repository signing key
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - /usr/share/keyrings/claude-desktop-archive-keyring.asc
      register: claude_desktop_signing_key_details
      changed_when: false

    - name: Verify Claude Desktop repository signing key fingerprint
      ansible.builtin.assert:
        that:
          - >-
            ('fpr:::::::::' ~ claude_desktop_signing_key_fingerprint ~ ':')
            in claude_desktop_signing_key_details.stdout
        fail_msg: >-
          The downloaded Claude Desktop repository signing key has an
          unexpected fingerprint.

    - name: Configure Claude Desktop ARM64 apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/claude-desktop.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ claude_desktop_repository_url }}
          Suites: stable
          Components: main
          Architectures: arm64
          Signed-By: /usr/share/keyrings/claude-desktop-archive-keyring.asc

    - name: Install Claude Desktop
      ansible.builtin.apt:
        name: claude-desktop
        state: present
        update_cache: true

    - name: Inspect Claude Desktop package architecture
      ansible.builtin.command:
        argv:
          - dpkg-query
          - --show
          - "--showformat=${Architecture}"
          - claude-desktop
      register: claude_desktop_package_architecture
      changed_when: false

    - name: Verify Claude Desktop package architecture
      ansible.builtin.assert:
        that:
          - claude_desktop_package_architecture.stdout == "arm64"
        fail_msg: Installed Claude Desktop package is not ARM64.

- name: Install Claude Code with its native installer
  when: install_claude_code | bool
  block:
    - name: Download Claude Code native installer
      ansible.builtin.get_url:
        url: https://claude.ai/install.sh
        dest: /var/tmp/claude-code-install.sh
        mode: "0755"

    - name: Run Claude Code native installer as workstation user
      ansible.builtin.command:
        argv:
          - /bin/bash
          - /var/tmp/claude-code-install.sh
          - "{{ claude_code_channel }}"
        creates: "{{ workstation_home }}/.local/bin/claude"
      become: true
      become_user: "{{ workstation_user }}"
      environment:
        HOME: "{{ workstation_home }}"
        USER: "{{ workstation_user }}"

- name: Sync selected Claude Code configuration from the controller
  tags: [claude_config]
  when:
    - install_claude_code | bool
    - sync_controller_claude_config | bool
  block:
    - name: Inspect selected controller Claude Code files
      ansible.builtin.stat:
        path: "{{ controller_claude_config_dir }}/{{ item.path }}"
      loop: "{{ controller_claude_config_files }}"
      loop_control:
        label: "{{ item.path }}"
      register: controller_claude_file_stats
      delegate_to: localhost
      become: false

    - name: Inspect selected controller Claude Code directories
      ansible.builtin.stat:
        path: "{{ controller_claude_config_dir }}/{{ item }}"
      loop: "{{ controller_claude_config_directories }}"
      loop_control:
        label: "{{ item }}"
      register: controller_claude_directory_stats
      delegate_to: localhost
      become: false

    - name: Create target Claude Code configuration directories
      ansible.builtin.file:
        path: "{{ workstation_home }}/.claude/{{ item }}"
        state: directory
        owner: "{{ workstation_user }}"
        group: "{{ workstation_group }}"
        mode: "0700"
      loop:
        - ""
        - hooks

    - name: Copy available controller Claude Code files
      ansible.builtin.copy:
        src: "{{ controller_claude_config_dir }}/{{ item.item.path }}"
        dest: "{{ workstation_home }}/.claude/{{ item.item.path }}"
        owner: "{{ workstation_user }}"
        group: "{{ workstation_group }}"
        mode: "{{ item.item.mode }}"
      loop: "{{ controller_claude_file_stats.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.stat.isreg | default(false)

    - name: Create available target Claude Code directory roots
      ansible.builtin.file:
        path: "{{ workstation_home }}/.claude/{{ item.item }}"
        state: directory
        owner: "{{ workstation_user }}"
        group: "{{ workstation_group }}"
        mode: "0700"
      loop: "{{ controller_claude_directory_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isdir | default(false)

    - name: Merge available controller Claude Code directories
      ansible.builtin.copy:
        src: "{{ controller_claude_config_dir }}/{{ item.item }}/"
        dest: "{{ workstation_home }}/.claude/{{ item.item }}/"
        owner: "{{ workstation_user }}"
        group: "{{ workstation_group }}"
        mode: preserve
        directory_mode: "0700"
      loop: "{{ controller_claude_directory_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isdir | default(false)

    - name: Restore private permissions on synced Claude directory roots
      ansible.builtin.file:
        path: "{{ workstation_home }}/.claude/{{ item.item }}"
        state: directory
        owner: "{{ workstation_user }}"
        group: "{{ workstation_group }}"
        mode: "0700"
      loop: "{{ controller_claude_directory_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isdir | default(false)

    - name: Inspect synced files that may contain controller paths
      ansible.builtin.stat:
        path: "{{ workstation_home }}/.claude/{{ item }}"
      loop: "{{ controller_claude_path_rewrite_files }}"
      loop_control:
        label: "{{ item }}"
      register: target_claude_path_files

    - name: Rewrite controller home paths for the workstation
      ansible.builtin.replace:
        path: "{{ workstation_home }}/.claude/{{ item.item }}"
        regexp: "{{ controller_user_home | regex_escape }}"
        replace: "{{ workstation_home }}"
      loop: "{{ target_claude_path_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.isreg | default(false)
